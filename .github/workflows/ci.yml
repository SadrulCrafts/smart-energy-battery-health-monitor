# Runs on every push and pull request: backend tests, dashboard lint + build,
# and an Arduino Uno compile of the firmware. Nothing here needs hardware or secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # The trained model (.joblib) is not stored in Git, so the 5 tests that need
      # it are skipped here; they run on a machine where the model has been trained.
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -rs

  frontend:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  firmware:
    name: Firmware compile (Arduino Uno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - firmware/battery_monitor
          libraries: |
            - name: Adafruit INA219
            - name: OneWire
            - name: DallasTemperature
          enable-warnings-report: true
